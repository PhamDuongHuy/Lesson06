<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: rotate(20deg);
        }

        .b {
            width: 120px;
            height: 50px;
            background-color: aqua;
            transform: skewY(20deg);
        }

        .c {
            width: 120px;
            height: 50px;
            background-color: pink;
            transform: scaleY(1.5);
        }

        .d {
            width: 120px;
            height: 50px;
            background-color: violet;
            transform: translateX(100%);
        }
    </style>
</head>

<body>
    <h2>transform: rotate(20deg)</h2>
    <div class="a">Rotate - Xoay</div>
    <h2>transform: skewY(20deg)</h2>
    <div class="b">skew - Nghiêng</div>
    <h2>transform: scaleY(1.5)</h2>
    <div class="c">Scale - Phóng to</div>
    <h2>transform: translateX(100%)</h2>
    <div class="d">translate - Di chuyển</div>
</body>

</html>
