<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: all 3s;
        }

        .box:hover {
            width: 300px;
            height: 300px;
            background-color: orange;
        }
    </style>
</head>

<body>
    <h1>
        Hover CSS - Áp dụng các thuộc tính CSS khi
        hover (hover - Sự kiện khi di chuột vào khối đó)
    </h1>
    <div class="box"></div>
</body>

</html>
